---
# Single source of truth for the Phase 2 storage layout.
#
# Read by playbooks/02_storage.yml (build the stack) and
# playbooks/03_storage_verify.yml (prove it survives a reboot). Keeping the
# list HERE means the build playbook and the verify playbook can never drift
# apart: they resolve the same serials, expect the same VG/LV names and check
# the same mount points, from one file.
#
# The serial values must match the disk blocks in terraform/vm.tf exactly.
# The serial is the join key between the two sides: Terraform decides which
# disks EXIST (and their sizes, in tfvars); this file decides what each disk
# BECOMES inside the guest (VG, LV, mount point). Device letters are never
# listed here or anywhere else - both playbooks resolve serial -> device
# fresh from the kernel view on every run.
#
# Enable the optional scratch disk (terraform: scratch_disk_size_gb > 0)?
# Append its entry, then run 02_storage.yml:
#   - serial: scratch01
#     vg: vg_scratch
#     lv: lv_scratch
#     mount: /srv/scratch
data_disks:
  - serial: var01        # scsi1, size: var_disk_size_gb
    vg: vg_var
    lv: lv_var
    mount: /srv/var
  - serial: log01        # scsi2, size: log_disk_size_gb
    vg: vg_log
    lv: lv_log
    mount: /srv/log
  - serial: data01       # scsi3, size: data_disk_size_gb
    vg: vg_data
    lv: lv_data
    mount: /srv/data
  - serial: backup01     # scsi4, size: backup_disk_size_gb
    vg: vg_backup
    lv: lv_backup
    mount: /srv/backup

# 03_storage_verify.yml reboots the VM by default (that is the point: fstab
# entries and LVM activation only prove themselves at boot). Quick check
# without the downtime:
#   ansible-playbook playbooks/03_storage_verify.yml -e verify_reboot=false
verify_reboot: true

# =========================================================================
# Phase 3: the agent layer (04/05/06 all read this section).
# =========================================================================
# Lab story: ctrl-01 (192.168.122.10) stands in for BOTH central systems,
# the monitoring server and the log receiver. Point these at the real
# ones when they exist; the playbooks change nothing else.

# ---- 04_zabbix_agent.yml -----------------------------------------------
# Repo pin: Zabbix 7.0 LTS. Live-checked Aug 2026: 7.0 publishes an
# Ubuntu 26.04 (resolute) section; 8.0/8.2 do not yet. Ubuntu universe
# also ships zabbix-agent2 (7.0.22); with the official repo added, apt
# elects the newer 7.0.30 from repo.zabbix.com - the playbook asserts
# that election every run.
zabbix_agent_version: "7.0"
zabbix_agent_server: "192.168.122.10"        # passive checks come FROM here
zabbix_agent_serveractive: "192.168.122.10"  # active checks go TO here
zabbix_agent_listenport: 10050
zabbix_agent_hostname: "{{ inventory_hostname }}"

# ---- 05_rsyslog_forward.yml --------------------------------------------
# QRadar pattern: forward everything over TCP with a disk-assisted
# queue. The lab receiver is a socat one-liner on ctrl-01 (guide
# chapter 3); it listens on 5514, an UNPRIVILEGED port, so the lab
# needs no root daemon. Run it under nohup so it survives its SSH
# session - the 28 Aug 2026 field run lost a receiver that way and
# the disk queue had to prove itself (guide ch3, the outage that ran
# itself). Production QRadar listens on 514 - change this one var
# and re-run.
rsyslog_receiver_host: "192.168.122.10"
rsyslog_receiver_port: 5514
rsyslog_forward_protocol: tcp        # tcp (QRadar-style) or udp
rsyslog_queue_maxdisk: "100m"        # on-disk buffer while the receiver is down
rsyslog_test_tag: "phase3-test"      # smoke-test tag the playbook emits

# ---- 06_security_agents.yml --------------------------------------------
# Stub installers: the harness is real (directories, script, marker,
# verification), the payload is an echo. mode: real is reserved for
# licensed installers and intentionally fails the guard until one is
# wired in (guide chapter 4 has the swap-in runbook). Bumping version
# makes the marker assert fail ON PURPOSE: old marker + new desired
# version is drift, and drift should be loud.
security_agents:
  - name: trendmicro
    display_name: Trend Micro Deep Security Agent
    mode: stub
    version: "1.0.0-stub"
    install_dir: /opt/TrendMicro
  - name: manageengine
    display_name: ManageEngine EventLog Analyzer Agent
    mode: stub
    version: "1.0.0-stub"
    install_dir: /opt/ManageEngine
