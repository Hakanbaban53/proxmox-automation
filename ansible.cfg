# Root ansible.cfg - used when the playbooks run from the REPO ROOT,
# which is exactly how Semaphore runs them (it clones the repository and
# executes `ansible-playbook -i <semaphore-inventory> <playbook>` in the
# clone's top directory). ansible.cfg discovery walks up from the cwd, so
# this file wins for those runs; ansible/ansible.cfg still wins for the
# Phase 1-3 habit of cd ansible && ansible-playbook playbooks/...
#
# The inventory line here is only a fallback: Semaphore passes -i
# explicitly, and CLI deploy runs pass it explicitly too, because the
# deploy flow needs inventory/provisioning.yml (see that file for why),
# not the maintenance inventory.
[defaults]
inventory = ansible/inventory/provisioning.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
